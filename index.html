<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SwissViz — Swiss Companies Map</title>
        <meta name="description" content="Interactive map of 750k+ Swiss companies visualised by location, canton, and legal form. Built with open data from opendata.swiss." />
        <meta name="author" content="ExtraPolo.com" />
        <meta property="og:title" content="SwissViz — Swiss Companies Map" />
        <meta property="og:description" content="Interactive map of 750k+ Swiss companies visualised by location, canton, and legal form. Built with open data from opendata.swiss." />
        <meta property="og:image" content="https://rafapolo.github.io/swissviz/mini.jpg" />
        <meta property="og:url" content="https://rafapolo.github.io/swissviz/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="SwissViz" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://rafapolo.github.io/swissviz/mini.jpg" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇨🇭</text></svg>"
        />
        <link rel="preload" href="data/BE.json" as="fetch" crossorigin />
        <link rel="preload" href="data/BE_0.json.gz" as="fetch" crossorigin />
        <link rel="preconnect" href="https://unpkg.com" crossorigin />
        <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.mjs" crossorigin />
        <link href="https://unpkg.com/maplibre-gl@6.14.0/dist/maplibre-gl.css" rel="stylesheet" />
        <!-- non-blocking: the system font shows until Inter arrives -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
        <style>
            :root {
                --bg: #1e2a3e;
                --accent: #6c8eff;
                --border: rgba(255, 255, 255, 0.07);
                --border-subtle: rgba(255, 255, 255, 0.06);
                --border-mid: rgba(255, 255, 255, 0.1);
                --surface: rgba(255, 255, 255, 0.06);
                --white-dim: rgba(255, 255, 255, 0.08);
                --white-muted: rgba(255, 255, 255, 0.5);
                --white-soft: rgba(255, 255, 255, 0.6);
                --shadow-dark: rgba(0, 0, 0, 0.6);
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: var(--bg);
                color: #fff;
                overflow: hidden;
            }
            /* Frame tinted with the average color of the companies in view */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                border: 3px solid var(--frame-color, transparent);
                /* bottom corners sit in the browser window's own rounded corners
                   (~26pt on macOS 26), so they need a larger radius or they get clipped */
                border-radius: 14px 14px 28px 28px;
                /* fill the corners outside the curve so the viewport itself reads as rounded */
                box-shadow: 0 0 0 28px #151b24;
                pointer-events: none;
                z-index: 9999;
                transition: border-color 0.4s;
            }
            .maplibregl-ctrl-logo,
            .maplibregl-ctrl-attrib {
                opacity: 0.3;
            }
            #map {
                width: 100vw;
                height: 100vh;
                position: relative;
                z-index: 0;
                outline: none;
            }
            #map:focus,
            #map canvas:focus,
            #map canvas {
                outline: none;
            }
            /* Visible focus styles for keyboard navigation */
            :focus-visible {
                outline: 2px solid rgba(108, 142, 255, 0.8);
                outline-offset: 2px;
            }
            button:focus-visible,
            .lang-btn:focus-visible {
                outline: 2px solid rgba(108, 142, 255, 0.8);
                outline-offset: 2px;
                border-radius: 3px;
            }
            .legend-item:focus-visible,
            .canton-item:focus-visible {
                outline: 2px solid rgba(108, 142, 255, 0.8);
                outline-offset: 1px;
                background: rgba(255, 255, 255, 0.06);
            }
            /* Tooltip */
            #tooltip {
                z-index: 13;
                position: absolute;
                padding: 14px 16px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 14px;
                pointer-events: none;
                display: none;
                max-width: 320px;
                box-shadow: 0 8px 32px var(--shadow-dark);
            }
            #tooltip h3 {
                color: #fff;
                margin-bottom: 6px;
                font-size: 14px;
                font-weight: 500;
                line-height: 1.3;
            }
            #tooltip p {
                margin: 3px 0;
                color: rgba(255, 255, 255, 0.6);
                font-size: 12px;
            }
            #tooltip span {
                color: rgba(255, 255, 255, 0.75);
            }
            /* pinned card (click / search): selectable, scrollable, links live */
            #tooltip.pinned {
                pointer-events: auto;
                user-select: text;
                max-height: min(420px, calc(100vh - 40px));
                overflow-y: auto;
            }
            #tooltip.pinned #tooltip-close {
                display: block;
            }
            .tt-link {
                display: none;
                margin-left: auto;
                padding: 0 2px;
                color: var(--accent);
                text-decoration: none;
                font-size: 13px;
                flex-shrink: 0;
            }
            .tt-link:hover {
                color: #fff;
            }
            #tooltip.pinned .tt-link {
                display: inline;
            }
            @media (hover: none) {
                .tt-link {
                    display: inline;
                }
            }
            /* spinners keep turning: they are status, not decoration */
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    transition-duration: 0.01ms !important;
                }
            }

            /* Shared panel */
            .panel {
                z-index: 12;
                opacity: 0.97;
                position: absolute;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 14px 16px;
                font-size: 14px;
                overflow-y: auto;
                max-height: calc(100vh - 40px);
            }
            .panel::-webkit-scrollbar {
                width: 3px;
            }
            .panel::-webkit-scrollbar-track {
                background: transparent;
            }
            .panel::-webkit-scrollbar-thumb {
                background: var(--border-mid);
                border-radius: 3px;
            }
            .panel-header {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 4px;
            }
            .panel-dot {
                color: var(--accent);
                font-size: 14px;
                line-height: 1;
                padding-bottom: 3px;
            }
            .panel-header h2 {
                color: rgba(255, 255, 255, 0.9);
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.02em;
            }
            .lang-switcher {
                display: flex;
                gap: 2px;
                margin-left: auto;
            }
            .lang-btn {
                background: var(--surface);
                border: 1px solid var(--border-mid);
                border-radius: 3px;
                color: rgba(255, 255, 255, 0.65);
                font-family: inherit;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.05em;
                padding: 2px 5px;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s,
                    border-color 0.15s;
                line-height: 1.4;
            }
            .lang-btn:hover {
                background: var(--border-mid);
                color: rgba(255, 255, 255, 0.7);
            }
            .lang-btn.active {
                background: rgba(108, 142, 255, 0.15);
                border-color: rgba(108, 142, 255, 0.4);
                color: var(--accent);
            }
            .panel-subtitle {
                color: rgba(255, 255, 255, 0.55);
                font-size: 11px;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--border-subtle);
            }
            .panel-controls {
                display: flex;
                gap: 6px;
                padding: 10px 0;
                border-bottom: 1px solid var(--border-subtle);
                margin-bottom: 10px;
            }
            .panel-controls button {
                flex: 1;
                background: var(--surface);
                border: 1px solid var(--border-mid);
                border-radius: 4px;
                color: rgba(255, 255, 255, 0.75);
                font-family: inherit;
                font-size: 12px;
                padding: 8px 0;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
                letter-spacing: 0.03em;
            }
            .panel-controls button:hover,
            .panel-controls button:active {
                background: rgba(255, 255, 255, 0.12);
                color: rgba(255, 255, 255, 0.9);
            }
            .panel-controls button.active {
                background: rgba(255, 203, 153, 0.18);
                border-color: rgba(255, 203, 153, 0.5);
                color: rgb(255, 203, 153);
            }
            #night-view-controls {
                border-top: 1px solid var(--border-subtle);
                border-bottom: none;
                margin-bottom: 0;
            }
            #night-intensity-row {
                max-height: 0;
                opacity: 0;
                overflow: hidden;
                padding: 0;
                transition:
                    max-height 0.3s ease,
                    opacity 0.25s ease,
                    padding 0.3s ease;
            }
            #night-intensity-row.visible {
                max-height: 60px;
                opacity: 1;
                padding: 10px 0 14px;
            }
            #night-intensity-row input[type="range"] {
                width: 100%;
                accent-color: rgba(255, 197, 143, 0.9);
                cursor: pointer;
            }

            /* Legend — right */
            #legend {
                top: 20px;
                right: 20px;
                min-width: 285px;
                padding: 14px 16px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                margin: 4px 0;
                gap: 8px;
                cursor: pointer;
                user-select: none;
                transition: opacity 0.15s;
                padding: 4px;
                border-radius: 4px;
            }
            .legend-item:hover,
            .legend-item:active {
                opacity: 0.8;
            }
            .legend-item.inactive {
                opacity: 0.3;
            }
            .legend-item.inactive .legend-color {
                filter: grayscale(1);
            }
            .legend-color {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                flex-shrink: 0;
                transition: filter 0.15s;
            }
            .legend-label {
                color: rgba(255, 255, 255, 0.65);
                font-size: 13px;
                flex: 1;
            }
            .legend-count {
                color: var(--white-muted);
                font-size: 12px;
            }

            /* Canton panel — left */
            #canton-panel {
                top: 20px;
                left: 20px;
                min-width: 285px;
                max-height: calc(100vh - 40px);
            }
            .canton-item {
                display: flex;
                align-items: center;
                margin: 4px 0;
                gap: 8px;
                cursor: pointer;
                user-select: none;
                transition: opacity 0.15s;
                padding: 4px;
                border-radius: 4px;
            }
            .canton-item:hover,
            .canton-item:active {
                background: rgba(255, 255, 255, 0.04);
            }
            .canton-item.inactive {
                opacity: 0.35;
            }
            .canton-badge {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.05em;
                background: var(--white-dim);
                border-radius: 3px;
                padding: 3px 6px;
                color: var(--white-soft);
                min-width: 30px;
                text-align: center;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .canton-item.active .canton-badge {
                background: rgba(108, 142, 255, 0.2);
                color: var(--accent);
            }
            .canton-name {
                color: var(--white-soft);
                font-size: 13px;
                flex: 1;
            }
            .canton-count {
                color: rgba(255, 255, 255, 0.5);
                font-size: 12px;
            }
            .canton-spinner {
                display: inline-block;
                width: 10px;
                height: 10px;
                border: 2px solid rgba(255, 255, 255, 0.2);
                border-top-color: var(--accent);
                border-radius: 50%;
                vertical-align: middle;
                animation: canton-spin 0.7s linear infinite;
            }
            @keyframes canton-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Panel collapse toggle (corner — expand trigger, hidden under open panel) */
            .panel-toggle {
                display: flex;
                position: absolute;
                width: 44px;
                height: 44px;
                background: var(--bg);
                border: 1px solid var(--border-mid);
                border-radius: 8px;
                cursor: pointer;
                align-items: center;
                justify-content: center;
                z-index: 11;
                font-size: 16px;
                color: #fff;
            }

            /* In-panel collapse arrow (desktop only) */
            .panel-arrow {
                background: none;
                border: none;
                color: rgba(255, 255, 255, 0.5);
                cursor: pointer;
                font-size: 18px;
                padding: 0 2px;
                line-height: 1;
                transition: color 0.15s;
                flex-shrink: 0;
            }
            .panel-arrow:hover {
                color: rgba(255, 255, 255, 0.55);
            }
            #collapse-canton {
                margin-left: auto;
            }
            @media (max-width: 980px) {
                .panel-arrow { display: none; }
            }
            #toggle-canton {
                top: 20px;
                left: 20px;
            }
            #toggle-legend {
                top: 20px;
                right: 20px;
            }

            /* GitHub repo link (bottom-right) */
            #github-link {
                display: flex;
                position: fixed;
                bottom: 16px;
                right: 16px;
                width: 36px;
                height: 36px;
                background: var(--bg);
                border: 1px solid var(--border-mid);
                border-radius: 8px;
                align-items: center;
                justify-content: center;
                z-index: 12;
                color: rgba(255, 255, 255, 0.5);
                transition: color 0.15s, border-color 0.15s;
            }
            #github-link:hover,
            #github-link:focus-visible {
                color: #fff;
                border-color: var(--border-mid);
            }
            #github-link svg {
                width: 18px;
                height: 18px;
            }

            /* Tooltip close button (mobile) */
            #tooltip-close {
                display: none;
                position: absolute;
                top: 8px;
                right: 10px;
                background: none;
                border: none;
                color: rgba(255, 255, 255, 0.4);
                font-size: 18px;
                cursor: pointer;
                padding: 4px;
                line-height: 1;
            }

            #title {
                z-index: 10;
            }

            @media (min-width: 981px) {
                .panel {
                    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                }
                #canton-panel.collapsed {
                    transform: translateX(calc(-100% - 20px));
                }
                #legend.collapsed {
                    transform: translateX(calc(100% + 20px));
                }
            }
            @media (max-width: 980px) {
                /* Panels become full-width bottom sheets */
                .panel {
                    position: fixed !important;
                    top: auto !important;
                    left: 0 !important;
                    right: 0 !important;
                    bottom: 0 !important;
                    width: 100% !important;
                    /* Stop below the top bar (search + toggles end at ~64px) */
                    max-height: min(75vh, calc(100vh - 84px)) !important;
                    max-height: min(75dvh, calc(100dvh - 84px)) !important;
                    min-width: unset;
                    border-radius: 16px 16px 0 0;
                    border-left: none;
                    border-right: none;
                    border-bottom: none;
                    transform: translateY(100%);
                    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                    overflow-y: auto;
                    display: block;
                    /* drag handle */
                    padding-top: 20px;
                }
                .panel::before {
                    content: "";
                    display: block;
                    width: 36px;
                    height: 4px;
                    background: rgba(255, 255, 255, 0.15);
                    border-radius: 2px;
                    margin: -12px auto 12px;
                }
                .panel.open {
                    transform: translateY(0);
                }
                #tooltip {
                    max-width: calc(100vw - 20px);
                    left: 10px !important;
                    right: 10px;
                }
                #tooltip-close {
                    display: block;
                }
                .maplibregl-ctrl-bottom-right {
                    bottom: 16px !important;
                    right: 16px !important;
                }
            }
            /* Touch: tooltip becomes a bottom sheet with a scrollable stacked list */
            @media (hover: none) {
                #tooltip {
                    position: fixed;
                    left: 0 !important;
                    right: 0;
                    top: auto !important;
                    bottom: 0;
                    max-width: none;
                    max-height: 45vh;
                    padding: 14px 16px 0;
                    border-radius: 12px 12px 0 0;
                    border-bottom: none;
                    pointer-events: auto;
                    flex-direction: column;
                }
                #tooltip-content {
                    overflow-y: auto;
                    overscroll-behavior: contain;
                    -webkit-overflow-scrolling: touch;
                    padding-bottom: calc(14px + env(safe-area-inset-bottom));
                    min-height: 0;
                }
                #tooltip-close {
                    display: block;
                }
            }

            /* Loading pill — the map is usable underneath while the first canton streams in */
            #loading-screen {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 100;
                background: var(--bg);
                border: 1px solid var(--border-mid);
                border-radius: 999px;
                padding: 8px 16px 8px 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                gap: 10px;
                pointer-events: none;
                transition: opacity 0.4s ease;
            }
            #loading-screen.hidden {
                opacity: 0;
            }
            .spinner {
                width: 14px;
                height: 14px;
                border: 2px solid var(--white-dim);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.75s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            .loading-label {
                color: rgba(255, 255, 255, 0.7);
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            /* Search bar — center top */
            #search-bar {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 14;
                width: 400px;
                /* stay clear of both 285px panels (+ their 20px offsets) */
                max-width: calc(100vw - 660px);
            }
            #search-wrapper {
                display: flex;
                align-items: center;
                background: var(--bg);
                border: 1px solid var(--border-mid);
                border-radius: 8px;
                padding: 0 12px;
                gap: 8px;
                height: 44px; /* match the 44px panel toggles */
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
                transition: border-color 0.15s;
            }
            #search-wrapper:focus-within {
                border-color: rgba(108, 142, 255, 0.4);
            }
            #search-icon {
                color: var(--white-muted);
                font-size: 15px;
                flex-shrink: 0;
                line-height: 1;
                user-select: none;
            }
            #search-icon.loading {
                font-size: 0;
                width: 13px;
                height: 13px;
                border: 1.5px solid var(--border-mid);
                border-top-color: rgba(255, 255, 255, 0.45);
                border-radius: 50%;
                animation: spin 0.75s linear infinite;
                flex-shrink: 0;
            }
            #search-input {
                flex: 1;
                background: none;
                border: none;
                outline: none;
                color: #fff;
                font-family: inherit;
                font-size: 13px;
                letter-spacing: 0.02em;
                min-width: 0;
            }
            #search-input::placeholder {
                color: rgba(255, 255, 255, 0.22);
            }
            #search-input:placeholder-shown {
                text-align: center;
            }
            #search-clear {
                background: none;
                border: none;
                color: var(--white-muted);
                cursor: pointer;
                font-size: 12px;
                padding: 2px;
                display: none;
                line-height: 1;
                flex-shrink: 0;
            }
            #search-clear:hover {
                color: var(--white-soft);
            }
            #search-count {
                color: rgba(255, 255, 255, 0.55);
                font-size: 11px;
                letter-spacing: 0.04em;
                flex-shrink: 0;
                display: none;
            }
            #search-results {
                margin-top: 6px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                display: none;
                box-shadow: 0 8px 32px var(--shadow-dark);
                max-height: 320px;
                overflow-y: auto;
            }
            #search-results::-webkit-scrollbar { width: 3px; }
            #search-results::-webkit-scrollbar-track { background: transparent; }
            #search-results::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
            .search-result-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 12px;
                height: 36px;
                box-sizing: border-box;
                cursor: pointer;
                transition: background 0.12s;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                flex-shrink: 0;
            }
            .search-result-item:hover { background: rgba(255, 255, 255, 0.05); }
            .search-result-item.keyboard-active { background: rgba(255, 255, 255, 0.1); }
            .search-result-name {
                color: rgba(255, 255, 255, 0.8);
                font-size: 13px;
                flex: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .search-result-form {
                color: rgba(255, 255, 255, 0.45);
                font-size: 11px;
                flex-shrink: 0;
                max-width: 40%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .search-no-results {
                padding: 12px;
                color: rgba(255, 255, 255, 0.55);
                font-size: 12px;
                text-align: center;
            }
            @media (max-width: 980px) {
                #search-bar {
                    left: 74px;
                    right: 74px;
                    width: auto;
                    max-width: none;
                    transform: none;
                }
            }
            .search-marker {
                width: 18px; height: 18px;
                border-radius: 50%;
                background: transparent;
                border: 2.5px solid #46e821;
                box-shadow: 0 0 0 1.5px rgba(0,0,0,0.4);
                pointer-events: none;
            }
            .load-error {
                position: fixed;
                bottom: 70px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 12px;
                background: rgba(200, 60, 60, 0.9);
                color: #fff;
                padding: 8px 10px 8px 16px;
                border-radius: 6px;
                font-size: 13px;
                z-index: 20;
            }
            .load-error button {
