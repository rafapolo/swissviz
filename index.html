            function getLabel(rechtsform) {
                if (_labelCache.has(rechtsform)) return _labelCache.get(rechtsform);
                const rf = rechtsform.toUpperCase();
                for (const a of colorAssignments) {
                    if (rf.includes(a.rfKey)) {
                        _labelCache.set(rechtsform, a.label);
                        return a.label;
                    }
                }
                _labelCache.set(rechtsform, rechtsform);
                return rechtsform;
            }

            // ── State ──────────────────────────────────────────────────────────────
            const activeLabels = new Set(colorAssignments.map((a) => a.label)); // active legal forms
            const activeCantons = new Set();
            let displayTotal = 0;
            const BERN = { lng: 7.44, lat: 46.95 };
            let nightView = false;
            let anchorIntensity = 50;
            let anchorZoom = 12;
            const nightColor = [255, 197, 143];
            function effectiveIntensity() {
                const z = map.getZoom();
                if (z <= anchorZoom) {
                    if (anchorZoom <= 6) return anchorIntensity;
                    const t = Math.max(0, (z - 6) / (anchorZoom - 6));
                    return Math.max(
                        1,
                        Math.round(1 + (anchorIntensity - 1) * t),
                    );
                } else {
                    if (anchorZoom >= 16) return anchorIntensity;
                    const t = Math.min(1, (z - anchorZoom) / (16 - anchorZoom));
                    return Math.min(
                        100,
                        Math.round(
                            anchorIntensity + (100 - anchorIntensity) * t,
                        ),
                    );
                }
            }
            const cantonData = {}; // id → point array
            const cantonTotals = {}; // id → company count of a loaded canton
            const searchIndex = []; // flat local index: { name, label, cantonId, point }
            const pointByName = {}; // cantonId → Map<name, point[]>
                        let overlay = null;
            let map = null;
            let searchMarkers = [];
            let searchMarkersTimer = null;

            const T_DECODE = {
                A: "Aktiengesellschaft",
                L: "Ausländische Niederlassung",
                B: "Besondere Rechtsform",
                E: "Einzelunternehmen",
                N: "Genossenschaft",
                G: "GmbH / SARL",
                H: "Haupt von Gemeinderschaften",
                I: "Institut des öffentlichen Rechts",
                K: "Kollektivgesellschaft",
                O: "Kommanditgesellschaft",
                Z: "Schweizerische Zweigniederlassung",
                S: "Stiftung",
                V: "Verein",
            };

            // ── Parse worker — offloads parseCantonData off the main thread ─────────
            const _workerSrc = `
const T=${JSON.stringify(T_DECODE)};
const C=${JSON.stringify(colorAssignments)};
function h2r(h){const r=/^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(h);return r?[parseInt(r[1],16),parseInt(r[2],16),parseInt(r[3],16)]:[100,100,100];}
const _cCache=new Map(),_lCache=new Map();
const LB=new Map(C.map((a,i)=>[a.label,1<<i]));
function gc(rf){if(_cCache.has(rf))return _cCache.get(rf);const u=rf.toUpperCase();for(const a of C){if(u.includes(a.rfKey)){const v=h2r(a.hex);_cCache.set(rf,v);return v;}}const f=h2r('#1a1a30');_cCache.set(rf,f);return f;}
function gl(rf){if(_lCache.has(rf))return _lCache.get(rf);const u=rf.toUpperCase();for(const a of C){if(u.includes(a.rfKey)){_lCache.set(rf,a.label);return a.label;}}_lCache.set(rf,rf);return rf;}
function parse(col,canton){const m=new Map(),n=col.n.length;for(let i=0;i<n;i++){const tRaw=col.t[i]||'',rf=(T[tRaw]||tRaw).trim();if(!rf)continue;const lat=col.lat[i],lng=col.lng[i];if(!lat||!lng)continue;const k=Math.round(lat*1e5)*1000000+Math.round(lng*1e5),label=gl(rf),co={name:col.n[i]||'',rechtsform:rf,label};if(!m.has(k))m.set(k,{position:[lng,lat],canton,companies:[],rechtsform:rf,label,color:gc(rf),mask:0});const p=m.get(k);p.companies.push(co);p.mask|=LB.get(label)||0;}return[...m.values()];}
self.onmessage=({data:{id,col,cantonId}})=>self.postMessage({id,points:parse(col,cantonId)});
`;
            const _parseWorker = new Worker(URL.createObjectURL(new Blob([_workerSrc], { type: "application/javascript" })));
            const _parsePending = new Map();
            let _parseSeq = 0;
            _parseWorker.onmessage = ({ data: { id, points } }) => { _parsePending.get(id)(points); _parsePending.delete(id); };
            function parseCantonDataAsync(col, cantonId) {
                return new Promise(res => { const id = _parseSeq++; _parsePending.set(id, res); _parseWorker.postMessage({ id, col, cantonId }); });
            }

            function indexCanton(cantonId, points) {
                const nameMap = new Map();
                for (const point of points) {
                    for (const co of point.companies) {
                        searchIndex.push({ name: co.name, fold: foldText(co.name), label: co.label, cantonId, point });
                        if (!nameMap.has(co.name)) nameMap.set(co.name, []);
                        nameMap.get(co.name).push(point);
                    }
                }
                pointByName[cantonId] = nameMap;
            }

            // ── Recompute legend/canton counts and frame color from the viewport ──────
            const _cantonCountEls = new Map(); // id → .canton-count element
            function updateLegendCounts() {
                const counts = {};
                const bounds = map ? map.getBounds() : null;
                const w = bounds?.getWest() ?? -Infinity, e = bounds?.getEast() ?? Infinity;
                const s = bounds?.getSouth() ?? -Infinity, n = bounds?.getNorth() ?? Infinity;
                const labelMask = activeLabelMask();
                let r = 0, g = 0, bl = 0, shown = 0;
                for (const [id, pts] of Object.entries(cantonData)) {
                    // inactive cantons aren't drawn, so show their full total instead of a viewport count
                    let cnt = cantonTotals[id] || 0;
                    if (activeCantons.has(id)) {
                        cnt = 0;
                        for (let i = 0; i < pts.length; i++) {
                            const d = pts[i];
                            const [lng, lat] = d.position;
                            if (lng < w || lng > e || lat < s || lat > n) continue;
                            const cos = d.companies;
                            cnt += cos.length;
                            for (let j = 0; j < cos.length; j++) {
                                const lbl = cos[j].label;
                                counts[lbl] = (counts[lbl] || 0) + 1;
                            }
                            if (!(d.mask & labelMask)) continue;
                            const rgb = nightView ? nightColor : pointRgb(d);
                            r += rgb[0]; g += rgb[1]; bl += rgb[2]; shown++;
                        }
                    }
                    // only loaded cantons; unloaded ones keep their static total
                    if (!pts.length) continue;
                    if (!_cantonCountEls.has(id))
                        _cantonCountEls.set(id, document.querySelector(`.canton-item[data-id="${id}"] .canton-count`));
                    const el = _cantonCountEls.get(id);
                    if (el) el.textContent = `(${cnt.toLocaleString(numLocale())})`;
                }
                document.querySelectorAll(".legend-item").forEach((el) => {
                    const label = el.dataset.label;
                    el.querySelector(".legend-count").textContent =
                        `(${(counts[label] || 0).toLocaleString(numLocale())})`;
                });
                document.body.style.setProperty(
                    "--frame-color",
                    shown ? `rgb(${Math.round(r / shown)}, ${Math.round(g / shown)}, ${Math.round(bl / shown)})` : "transparent",
                );
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
            }

            // failed canton: switch it back off so the map stays honest, and offer a retry
            function showLoadError(canton) {
                setCantonActive(canton.id, false);
                refreshLayer();
                const el = document.createElement("div");
                el.className = "load-error";
                el.setAttribute("role", "alert");
                const msg = document.createElement("span");
                msg.textContent = tf("loadFailed", { name: canton.name });
                const retry = document.createElement("button");
                retry.textContent = t("retry");
                retry.addEventListener("click", async () => {
                    el.remove();
                    setCantonActive(canton.id, true);
                    await loadCantonData(canton);
                    refreshLayer();
                });
                el.append(msg, retry);
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 8000);
            }

            // keeps activeCantons and the canton list item (class + aria) in sync
            function setCantonActive(id, on) {
                if (on) activeCantons.add(id);
                else activeCantons.delete(id);
                const el = document.querySelector(`.canton-item[data-id="${id}"]`);
                if (!el) return;
                el.classList.toggle("active", on);
                el.classList.toggle("inactive", !on);
                el.setAttribute("aria-checked", on ? "true" : "false");
            }

            async function gunzipJson(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const ds = new DecompressionStream("gzip");
                const blob = await new Response(
                    res.body.pipeThrough(ds),
                ).blob();
                return JSON.parse(await blob.text());
            }

            async function loadCantonChunk(cantonId, chunk) {
                return gunzipJson(`data/${cantonId}_${chunk}.json.gz`);
            }

            async function loadCantonAll(cantonId) {
                const meta = await fetch(`data/${cantonId}.json`).then((r) =>
                    r.json(),
                );
                let chunkPromises;
                if (Array.isArray(meta.chunks)) {
                    // Format: { chunks: ["XX_0.json.gz", ...] }
                    chunkPromises = meta.chunks.map((filename) =>
                        gunzipJson(`data/${filename}`),
                    );
                } else {
                    // Format: { _chunks: N }
                    chunkPromises = Array.from(
                        { length: meta._chunks },
                        (_, i) => loadCantonChunk(cantonId, i),
                    );
                }
                const chunks = await Promise.all(chunkPromises);
                return {
                    n: chunks.flatMap((c) => c.n),
                    t: chunks.flatMap((c) => c.t),
                    lat: chunks.flatMap((c) => c.lat),
                    lng: chunks.flatMap((c) => c.lng),
                };
            }

            // ── Legend items (counts are filled in by updateLegendCounts) ──────────
            function buildLegend() {
                const legendEl = document.getElementById("legend-items");
                colorAssignments.forEach((item) => {
                    const div = document.createElement("div");
                    div.className = "legend-item";
                    div.dataset.label = item.label;
                    div.setAttribute("role", "checkbox");
                    div.setAttribute("tabindex", "0");
                    div.setAttribute("aria-checked", "true");
                    // accessible name comes from the visible label + count
                    div.innerHTML = `
          <div class="legend-color" style="background:${item.hex}" aria-hidden="true"></div>
          <span class="legend-label">${item.label}</span>
          <span class="legend-count">(0)</span>`;
                    legendEl.appendChild(div);

                    div.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            div.click();
                        }
                    });
                });
            }

            // ── Load any canton from its chunks ───────────────────────────────────
            // one in-flight promise per canton, so fast re-clicks don't fetch twice;
            // a failed load is forgotten so the next click retries it
            const _cantonLoads = new Map();
            function loadCantonData(canton) {
                if (cantonData[canton.id]) return Promise.resolve(cantonData[canton.id]);
                if (_cantonLoads.has(canton.id)) return _cantonLoads.get(canton.id);

                const countEl = document.querySelector(
                    `.canton-item[data-id="${canton.id}"] .canton-count`,
                );
                if (countEl)
                    countEl.innerHTML =
                        '<span class="canton-spinner" role="status" aria-label="Loading"></span>';

                const p = (async () => {
                    try {
                        const rows = await loadCantonAll(canton.id);
                        const points = await parseCantonDataAsync(rows, canton.id);
                        cantonData[canton.id] = points;
                        indexCanton(canton.id, points);
                        const companyCount = points.reduce(
                            (s, p) => s + p.companies.length,
                            0,
                        );
                        cantonTotals[canton.id] = companyCount;
                        if (countEl)
                            countEl.textContent = `(${companyCount.toLocaleString(numLocale())})`;
                        return points;
                    } catch (e) {
                        if (countEl) countEl.textContent = "(–)";
                        showLoadError(canton);
                        return [];
                    } finally {
                        _cantonLoads.delete(canton.id);
                    }
                })();
                _cantonLoads.set(canton.id, p);
                return p;
            }

            // ── Layer builder ──────────────────────────────────────────────────────
            function pointRgb(d) {
                const matched = d.companies.find((c) => activeLabels.has(c.label));
                // use pre-built Map for O(1) color lookup; fallback to per-point cached color
                if (matched) return _labelToRgb.get(matched.label) ?? getColor(matched.rechtsform);
                return d.color;
            }

            // All loaded points live in one array that only changes when a canton
            // finishes loading; canton and legal-form filters run on the GPU
            // (DataFilterExtension) so toggling them never re-uploads positions
            let allPoints = [];
            let _allPointsKey = "";
            function syncAllPoints() {
                const key = Object.keys(cantonData).join();
                if (key === _allPointsKey) return;
                _allPointsKey = key;
                allPoints = [].concat(...Object.values(cantonData));
            }
            // bit i set ⇔ colorAssignments[i] is active (points carry the same mask)
            function activeLabelMask() {
                let m = 0;
                colorAssignments.forEach((a, i) => { if (activeLabels.has(a.label)) m |= 1 << i; });
                return m;
            }
            const _dataFilter = new deck.DataFilterExtension({ filterSize: 1 });
            const _touchMQ = window.matchMedia("(hover: none)");
            let _filterVersion = 0; // bumped on every canton/legend change

            function buildLayer() {
                syncAllPoints();
                const labelMask = activeLabelMask();
                return new deck.ScatterplotLayer({
                    id: "companies",
                    data: allPoints,
                    getPosition: (d) => d.position,
                    // alpha is constant per mode; night intensity rides on the layer
                    // opacity so zooming never recomputes per-point colors
                    getFillColor: (d) => {
                        if (nightView) return [...nightColor, 255];
                        const rgb = pointRgb(d);
                        return [rgb[0], rgb[1], rgb[2], 230];
                    },
                    getFilterValue: (d) => (activeCantons.has(d.canton) && d.mask & labelMask ? 1 : 0),
                    filterRange: [1, 1],
                    extensions: [_dataFilter],
                    updateTriggers: {
                        getFillColor: [nightView, labelMask],
                        getFilterValue: [_filterVersion],
                    },
                    getRadius: 18,
                    radiusScale: 1,
                    radiusMinPixels: nightView ? RADIUS_MIN * 0.9 : RADIUS_MIN,
                    radiusMaxPixels: nightView ? RADIUS_MAX * 0.9 : RADIUS_MAX,
                    pickable: true,
                    opacity: nightView ? effectiveIntensity() / 100 : 1,
                    stroked: false,
                    parameters: {
                        depthTest: false,
                        blend: true,
                        blendFunc: [770, 1],
                        blendEquation: 32774,
                    },
                    onHover: (info) => {
                        if (_touchMQ.matches) return;
                        showTooltip(info);
                    },
                    // touch: tap opens the bottom sheet; mouse: click pins the card
                    onClick: (info) => {
                        showTooltip(info, { pin: !_touchMQ.matches });
                        return true;
                    },
                });
            }

            // cheap redraw for props that don't change what is shown (night opacity on zoom)
            function redrawLayer() {
                if (overlay) overlay.setProps({ layers: [buildLayer()] });
            }

            function refreshLayer() {
                if (!overlay) return;
                _filterVersion++;
                overlay.setProps({ layers: [buildLayer()] });
                displayTotal = 0;
                for (const id of activeCantons) displayTotal += cantonTotals[id] || 0;
                document.getElementById("legend-subtitle").textContent =
                    TRANSLATIONS[currentLang].legendSubtitle + " (" + displayTotal.toLocaleString(numLocale()) + ")";
                updateLegendCounts();
                // Announce filter changes to screen readers
                const srStatus = document.getElementById("sr-status");
                if (srStatus) srStatus.textContent = tf("mapUpdated", { n: displayTotal.toLocaleString(numLocale()) });
                updateUrl();
            }

            // coalesce bursts of refreshes (many cantons landing together) into one frame
            let _refreshQueued = false;
            function refreshLayerSoon() {
                if (_refreshQueued) return;
                _refreshQueued = true;
                requestAnimationFrame(() => { _refreshQueued = false; refreshLayer(); });
            }

            // ── Shareable state in the URL hash ──────────────────────────────────
            // #z=11.5&ll=46.95,7.44&c=BE,ZH&off=3,7&night=1
            // (off = indexes into colorAssignments of legal forms switched off)
            function readUrlState() {
                const h = new URLSearchParams(location.hash.slice(1));
                const st = {};
                const z = parseFloat(h.get("z"));
                if (z >= 6 && z <= 18) st.zoom = z;
                const ll = (h.get("ll") || "").split(",").map(Number);
                if (ll.length === 2 && ll.every(Number.isFinite)) st.center = [ll[1], ll[0]];
                const c = (h.get("c") || "").split(",").filter((id) => _cantonById.has(id));
                if (h.has("c")) st.cantons = c;
                const off = (h.get("off") || "").split(",").filter((i) => /^\d+$/.test(i)).map((i) => colorAssignments[+i]?.label).filter(Boolean);
                if (off.length) st.labelsOff = off;
                st.night = h.get("night") === "1";
                return st;
            }
            const urlState = readUrlState();

            let _urlTimer = null;
            function updateUrl() {
                if (!map) return;
                clearTimeout(_urlTimer);
                _urlTimer = setTimeout(() => {
                    const c = map.getCenter();
                    const h = new URLSearchParams();
                    h.set("z", map.getZoom().toFixed(2));
                    h.set("ll", `${c.lat.toFixed(4)},${c.lng.toFixed(4)}`);
                    h.set("c", CANTONS.filter((k) => activeCantons.has(k.id)).map((k) => k.id).join(","));
                    const off = colorAssignments.flatMap((a, i) => (activeLabels.has(a.label) ? [] : [i]));
                    if (off.length) h.set("off", off.join(","));
                    if (nightView) h.set("night", "1");
                    // URLSearchParams escapes the commas; they are safe in a fragment
                    history.replaceState(null, "", location.pathname + location.search + "#" + h.toString().replace(/%2C/g, ","));
                }, 250);
            }

            // ── Boot ───────────────────────────────────────────────────────────────
            // Nothing here waits on data: the map and panels come up right away and
            // Bern streams in alongside the map style. Called at the end of the module,
            // once every declaration below exists.
            function boot() {
                buildLegend();
                applyLang(initialLang());
                const firstName = _cantonById.get((urlState.cantons ?? ["BE"])[0])?.name ?? "";
                document.getElementById("loading-label").textContent = tf("loadingCanton", { name: firstName });
                // legal forms switched off in a shared link
                for (const lbl of urlState.labelsOff ?? []) {
                    activeLabels.delete(lbl);
                    const el = document.querySelector(`.legend-item[data-label="${lbl}"]`);
                    el?.classList.add("inactive");
                    el?.setAttribute("aria-checked", "false");
                }

                // Build canton list
                const cantonEl = document.getElementById("canton-items");

                // counts:begin — generated by scripts/canton_counts.py
                const cantonCounts = {
                    AG: 45528,
                    AI: 2102,
                    AR: 5773,
                    BE: 68714,
                    BL: 20129,
                    BS: 18850,
                    FR: 25438,
                    GE: 56043,
                    GL: 3610,
                    GR: 19682,
                    JU: 6425,
                    LU: 34312,
                    NE: 13160,
                    NW: 5607,
                    OW: 4291,
                    SG: 41962,
                    SH: 6413,
                    SO: 18269,
                    SZ: 21947,
                    TG: 23135,
                    TI: 41450,
                    UR: 2376,
                    VD: 66682,
                    VS: 33969,
                    ZG: 41755,
                    ZH: 133003,
                };
                // counts:end
                CANTONS.forEach((canton) => {
                    const isActive = activeCantons.has(canton.id);
                    const cnt = cantonCounts[canton.id] || 0;
                    const div = document.createElement("div");
                    div.className =
                        "canton-item " + (isActive ? "active" : "inactive");
                    div.dataset.id = canton.id;
                    div.dataset.total = cnt;
                    div.setAttribute("role", "checkbox");
                    div.setAttribute("tabindex", "0");
                    div.setAttribute("aria-checked", isActive ? "true" : "false");
                    div.setAttribute("aria-label", `${canton.name} (${canton.id})`);
                    div.innerHTML = `
          <span class="canton-badge" aria-hidden="true">${canton.id}</span>
          <span class="canton-name">${canton.name}</span>
          <span class="canton-count">${cnt > 0 ? "(" + cnt.toLocaleString(numLocale()) + ")" : ""}</span>`;
                    cantonEl.appendChild(div);

                    async function toggleCanton() {
                        if (activeCantons.has(canton.id)) {
                            setCantonActive(canton.id, false);
                        } else {
                            setCantonActive(canton.id, true);
                            revealCanton(canton);
                            await loadCantonData(canton);
                        }
                        refreshLayer();
                    }

                    div.addEventListener("click", toggleCanton);
                    div.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            toggleCanton();
                        }
                    });
                });

                // Map — MapLibre + OpenFreeMap (open-source OSM vector tiles, no API key, no rate limit)
                map = new maplibregl.Map({
                    container: "map",
                    style: "https://tiles.openfreemap.org/styles/dark",
                    center: urlState.center ?? [BERN.lng, BERN.lat],
                    zoom: urlState.zoom ?? 11,
                    minZoom: 6,
                    maxZoom: 18,
                    pitch: 0,
                    bearing: 0,
                    antialias: true,
                    dragRotate: true,
                    attributionControl: false,
                });

                overlay = new deck.MapLibreOverlay({
                    layers: [buildLayer()],
                    // a click that hits no company closes a pinned card
                    onClick: (info) => { if (!info.object && _ttPinned) hideTooltip(); },
                });

                // start the first cantons (Bern, or the shared link's) now, in parallel
                // with the style and tiles
                const startCantons = urlState.cantons ?? ["BE"];
                startCantons.forEach((id) => setCantonActive(id, true));
                const firstCanton = Promise.all(startCantons.map((id) => loadCantonData(_cantonById.get(id))));

                map.on("load", async () => {
                    // Tint the OpenFreeMap base layers to match the app's dark-navy palette (--bg)
                    map.setPaintProperty("background", "background-color", "#151B24");
                    map.setPaintProperty("water", "fill-color", "rgba(20, 30, 55, 1)");

                    // Hide all place/street/POI labels so only the data layer reads
                    for (const layer of map.getStyle().layers) {
                        if (layer.type === "symbol") {
                            map.setLayoutProperty(layer.id, "visibility", "none");
                        }
                    }

                    map.addControl(
                        new maplibregl.AttributionControl({
                            compact: true,
                            customAttribution:
                                "© <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors, tiles by <a href='https://openfreemap.org'>OpenFreeMap</a>",
                        }),
                        "bottom-left",
                    );
                    // Start collapsed: only the "i" button shows, credits open on click
                    document
                        .querySelector(".maplibregl-ctrl-attrib")
                        ?.classList.remove("maplibregl-compact-show");
                    map.addControl(overlay);
                    map.on("moveend", updateLegendCounts);
                    map.on("moveend", updateUrl);

                    await firstCanton;
                    refreshLayer();
                    if (urlState.night && !nightView) document.getElementById("btn-night-view").click();

                    const ls = document.getElementById("loading-screen");
                    ls.classList.add("hidden");
                    setTimeout(() => ls.remove(), 450);
                });

                map.on("zoom", () => {
                    if (nightView) {
                        document.getElementById("night-intensity").value =
                            effectiveIntensity();
                        redrawLayer();
                    }
                });

                document
                    .getElementById("tooltip-close")
                    .addEventListener("click", hideTooltip);

                // ── Legend toggles ─────────────────────────────────────────────────
                document
                    .getElementById("legend-items")
                    .addEventListener("click", (e) => {
                        const item = e.target.closest(".legend-item");
                        if (!item) return;
                        const lbl = item.dataset.label;
                        if (activeLabels.has(lbl)) {
                            activeLabels.delete(lbl);
                            item.classList.add("inactive");
                            item.setAttribute("aria-checked", "false");
                        } else {
                            activeLabels.add(lbl);
                            item.classList.remove("inactive");
                            item.setAttribute("aria-checked", "true");
                        }
                        refreshLayer();
                    });

                document
                    .getElementById("btn-select-all")
                    .addEventListener("click", () => {
                        colorAssignments.forEach((a) =>
                            activeLabels.add(a.label),
                        );
                        document
                            .querySelectorAll(".legend-item")
                            .forEach((el) => { el.classList.remove("inactive"); el.setAttribute("aria-checked", "true"); });
                        refreshLayer();
                    });

                document
                    .getElementById("btn-deselect-all")
                    .addEventListener("click", () => {
                        activeLabels.clear();
                        document
                            .querySelectorAll(".legend-item")
                            .forEach((el) => { el.classList.add("inactive"); el.setAttribute("aria-checked", "false"); });
                        refreshLayer();
                    });

                document
                    .getElementById("btn-night-view")
                    .addEventListener("click", () => {
                        nightView = !nightView;
                        const btn = document.getElementById("btn-night-view");
                        btn.classList.toggle("active", nightView);
                        btn.setAttribute("aria-pressed", nightView ? "true" : "false");
                        document
                            .getElementById("night-intensity-row")
                            .classList.toggle("visible", nightView);
                        refreshLayer();
                    });

                document
                    .getElementById("night-intensity")
                    .addEventListener("input", (e) => {
                        anchorIntensity = +e.target.value;
                        anchorZoom = map.getZoom();
                        redrawLayer();
                    });

                // ── Canton all / none ──────────────────────────────────────────────
                document
                    .getElementById("btn-canton-all")
                    .addEventListener("click", () => {
                        // mark everything at once (each item spins while it loads)
                        // and draw each canton as soon as it arrives
                        CANTONS.forEach((c) => setCantonActive(c.id, true));
                        refreshLayer();
                        CANTONS.forEach((c) => loadCantonData(c).then(refreshLayerSoon));
                    });

                document
                    .getElementById("btn-canton-none")
                    .addEventListener("click", () => {
                        CANTONS.forEach((c) => setCantonActive(c.id, false));
                        refreshLayer();
                    });
            }

            // ── Tooltip helper (shared by hover + tap) ─────────────────────────────
            let _ttObject = null, _ttVersion = -1, _ttPinned = false;
            function hideTooltip() {
                const tt = document.getElementById("tooltip");
                tt.style.display = "none";
                tt.classList.remove("pinned");
                _ttObject = null;
                _ttPinned = false;
            }
            // opts.pin: keep it open (click / search result) so it can be read,
            // selected and its links followed; opts.focusName: list that company first
            function showTooltip(info, opts = {}) {
                const tt = document.getElementById("tooltip");
                if (!info.object) {
                    hideTooltip();
                    return;
                }
                const touch = _touchMQ.matches;
                if (_ttPinned && !opts.pin && !touch) return; // hover doesn't steal a pinned card
                _ttPinned = !!opts.pin;
                tt.classList.toggle("pinned", _ttPinned);
                // same point under the cursor and same filters: just follow the mouse
                if (info.object === _ttObject && _ttVersion === _filterVersion && !touch && !opts.pin) {
                    tt.style.left = Math.min(info.x + 15, window.innerWidth - 340) + "px";
                    tt.style.top = Math.min(info.y + 15, window.innerHeight - 220) + "px";
                    return;
                }
                _ttObject = info.object;
                _ttVersion = _filterVersion;

                const list = info.object.companies.filter((c) =>
                    activeLabels.has(c.label),
                );
                if (opts.focusName) {
                    const i = list.findIndex((c) => c.name === opts.focusName);
                    if (i > 0) list.unshift(...list.splice(i, 1));
                }
                const zefix = `https://www.zefix.ch/${currentLang}/search/entity/list?mainSearch=`;
                // the bottom sheet scrolls, so it can list far more than the floating tooltip
                const MAX = touch ? 500 : 10;
                const rows = list
                    .slice(0, MAX)
                    .map((c) => {
                        const hex = _labelToHex.get(c.label) ?? "#888";
                        return `
        <div style="border-top:1px solid rgba(255,255,255,0.06);margin-top:8px;padding-top:8px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="flex-shrink:0;width:10px;height:10px;border-radius:50%;background:${hex}"></span>
            <span style="color:#fff;font-weight:500;font-size:13px">${escapeHtml(c.name)}</span>
            <a class="tt-link" href="${zefix + encodeURIComponent(c.name)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(t("openInZefix"))}" aria-label="${escapeHtml(t("openInZefix"))}">↗</a>
          </div>
          <div style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:3px">${escapeHtml(labelText(c.label))}</div>
        </div>`;
                    })
                    .join("");
                const more =
                    list.length > MAX
                        ? `<div style="color:rgba(255,255,255,0.3);font-size:11px;margin-top:8px">+${(list.length - MAX).toLocaleString(numLocale())} ${t("more")}</div>`
                        : "";

                tt.style.display = touch ? "flex" : "block";
                if (!touch) {
                    tt.style.left =
                        Math.max(10, Math.min(info.x + 15, window.innerWidth - 340)) + "px";
                    tt.style.top =
                        Math.max(10, Math.min(info.y + 15, window.innerHeight - 220)) + "px";
                }
                const ttContent = document.getElementById("tooltip-content");
                ttContent.scrollTop = 0;
                ttContent.innerHTML = `
        <div style="color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:.05em;text-transform:uppercase">
          ${list.length.toLocaleString(numLocale())} ${t(list.length === 1 ? "company" : "companies")} · ${info.object.canton}
        </div>
        ${rows}${more}`;
            }

            // ── Panel toggles ──────────────────────────────────────────────────────
            document
                .getElementById("toggle-canton")
                .addEventListener("click", () => {
                    const panel = document.getElementById("canton-panel");
                    const btn = document.getElementById("toggle-canton");
                    if (window.innerWidth > 980) {
                        panel.classList.toggle("collapsed");
                        btn.setAttribute("aria-expanded", panel.classList.contains("collapsed") ? "false" : "true");
                    } else {
                        panel.classList.toggle("open");
                        btn.setAttribute("aria-expanded", panel.classList.contains("open") ? "true" : "false");
                        document.getElementById("legend").classList.remove("open");
                        document.getElementById("toggle-legend").setAttribute("aria-expanded", "false");
                    }
                });
            document
                .getElementById("toggle-legend")
                .addEventListener("click", () => {
                    const panel = document.getElementById("legend");
                    const btn = document.getElementById("toggle-legend");
                    if (window.innerWidth > 980) {
                        panel.classList.toggle("collapsed");
                        btn.setAttribute("aria-expanded", panel.classList.contains("collapsed") ? "false" : "true");
                    } else {
                        panel.classList.toggle("open");
                        btn.setAttribute("aria-expanded", panel.classList.contains("open") ? "true" : "false");
                        document.getElementById("canton-panel").classList.remove("open");
                        document.getElementById("toggle-canton").setAttribute("aria-expanded", "false");
                    }
                });

            // In-panel collapse arrows (desktop)
            document.getElementById("collapse-canton").addEventListener("click", () => {
                document.getElementById("canton-panel").classList.add("collapsed");
                document.getElementById("toggle-canton").setAttribute("aria-expanded", "false");
            });
            document.getElementById("collapse-legend").addEventListener("click", () => {
                document.getElementById("legend").classList.add("collapsed");
                document.getElementById("toggle-legend").setAttribute("aria-expanded", "false");
            });

            // Click on map closes panels
            document.getElementById("map").addEventListener("click", (e) => {
                if (e.target.id === "map" || e.target.classList.contains("maplibregl-canvas")) {
                    document.getElementById("canton-panel").classList.remove("open");
                    document.getElementById("legend").classList.remove("open");
                }
            });

            // camera moves honour prefers-reduced-motion
            const _reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            function flyTo(opts) {
                if (_reducedMotion.matches) map.jumpTo(opts);
                else map.flyTo({ duration: 800, ...opts });
            }
            function fitBounds(bounds, opts = {}) {
                map.fitBounds(bounds, { duration: _reducedMotion.matches ? 0 : 800, ...opts });
            }
            // after flying to a search hit, open its card pinned with that company on top
            function onHitShown(pts, name) {
                map.once("moveend", () => {
                    const p = pts[0];
                    const xy = map.project(p.position);
                    showTooltip({ object: p, x: xy.x, y: xy.y }, { pin: true, focusName: name });
                });
            }

            // canton switched on from the list: bring it into view if it is off-screen
            function revealCanton(canton) {
                if (map && !map.getBounds().contains([canton.lng, canton.lat]))
                    flyTo({ center: [canton.lng, canton.lat], zoom: Math.max(map.getZoom(), 10) });
            }

            // Escape: close a pinned card, then the mobile bottom sheets
            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape" || e.target.id === "search-input") return;
                if (document.getElementById("tooltip").style.display !== "none" && document.getElementById("tooltip").style.display) {
                    hideTooltip();
                    return;
                }
                document.getElementById("canton-panel").classList.remove("open");
                document.getElementById("legend").classList.remove("open");
            });

            // ── Search ─────────────────────────────────────────────────────────────
            // The 760k-name index lives in a worker: download, gunzip, parse, accent
            // folding and every query run off the main thread. Until it is ready,
            // search falls back to the cantons already loaded.
            const ROW_H = 36;
            const MAX_ROWS = 2000; // ranked results kept for the list; the count shows the full total
            let searchTimer = null;
            let _detachScroll = null;
            let activeHitIndex = -1, currentHits = [], currentRenderFn = null, currentResultsEl = null;

            // lowercase and strip diacritics: "zurich" finds "Zürich", "geneve" finds "Genève"
            function foldText(s) {
                return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
            }
            // 0 = name starts with q, 1 = a word starts with q, 2 = q anywhere
            function matchRank(name, q) {
                const i = name.indexOf(q);
                if (i < 0) return -1;
                if (i === 0) return 0;
                return /[\s"'(\-/&.,]/.test(name[i - 1]) || name.indexOf(" " + q) >= 0 ? 1 : 2;
            }

            const _searchWorkerSrc = `
const fold=${foldText.toString()};
const rank=${matchRank.toString()};
let idx=null,folded=null;
async function load(url){
  const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);
  const text=await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).text();
  idx=JSON.parse(text);folded=idx.n.map(fold);
}
function search(q,max){
  q=fold(q);const hits=[],seen=new Set();
  for(let i=0;i<folded.length;i++){const r=rank(folded[i],q);if(r<0)continue;const key=idx.n[i]+'\\0'+idx.c[i];if(seen.has(key))continue;seen.add(key);hits.push([r,i]);}
  hits.sort((a,b)=>a[0]-b[0]||idx.n[a[1]].length-idx.n[b[1]].length||(idx.n[a[1]]<idx.n[b[1]]?-1:1));
  const rows=hits.slice(0,max).map(([,i])=>[idx.n[i],idx.t[i],idx.c[i],idx.lat[i],idx.lng[i]]);
  return {total:hits.length,rows};
}
self.onmessage=async({data})=>{
  if(data.type==='load'){try{await load(data.url);self.postMessage({type:'ready'});}catch(e){self.postMessage({type:'error'});}}
  else if(data.type==='search'){self.postMessage({type:'result',id:data.id,...search(data.q,data.max)});}
};`;
            let _searchWorker = null;
            let searchReady = false; // global index loaded in the worker
            let _searchSeq = 0;

            function startSearchIndex() {
                if (_searchWorker) return;
                const icon = document.getElementById("search-icon");
                const input = document.getElementById("search-input");
                icon.classList.add("loading");
                input.placeholder = t("searchLoading");
                _searchWorker = new Worker(URL.createObjectURL(new Blob([_searchWorkerSrc], { type: "application/javascript" })));
                _searchWorker.onmessage = ({ data }) => {
                    if (data.type === "ready") {
                        searchReady = true;
                        icon.classList.remove("loading");
                        input.placeholder = t("searchReady");
                        if (input.value.trim()) runSearch(input.value);
                    } else if (data.type === "error") {
                        _searchWorker.terminate();
                        _searchWorker = null; // next focus retries
                        icon.classList.remove("loading");
                        input.placeholder = t("searchPlaceholder");
                    } else if (data.type === "result" && data.id === _searchSeq) {
                        const hits = data.rows.map(([name, tc, cantonId, lat, lng]) => ({
                            name, cantonId, lat, lng, label: getLabel(T_DECODE[tc] || tc),
                        }));
                        showHits(hits, data.total, true);
                    }
                };
                // blob workers resolve relative URLs against blob:, so pass an absolute one
                _searchWorker.postMessage({ type: "load", url: new URL("data/search_index.json.gz", location.href).href });
            }

            function closeResults() {
                if (_detachScroll) { _detachScroll(); _detachScroll = null; }
                activeHitIndex = -1; currentHits = [];
                document.getElementById("search-results").style.display = "none";
                document.getElementById("search-count").style.display = "none";
                document.getElementById("search-input").setAttribute("aria-expanded", "false");
            }

            function runSearch(query) {
                const q = foldText(query.trim());
                document.getElementById("search-clear").style.display = query ? "block" : "none";
                if (!q) { _searchSeq++; closeResults(); return; }

                if (searchReady) {
                    _searchWorker.postMessage({ type: "search", id: ++_searchSeq, q, max: MAX_ROWS });
                    return;
                }
                // fallback: loaded cantons only, ranked the same way
                _searchSeq++;
                const ranked = [];
                const seen = new Set();
                for (const e of searchIndex) {
                    const r = matchRank(e.fold, q);
                    if (r < 0) continue;
                    const key = e.name + "\0" + e.cantonId;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    ranked.push([r, e]);
                }
                ranked.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length);
                showHits(ranked.slice(0, MAX_ROWS).map(([, e]) => e), ranked.length, false);
            }

            function showHits(hits, total, global) {
                const resultsEl = document.getElementById("search-results");
                const countEl = document.getElementById("search-count");
                if (_detachScroll) { _detachScroll(); _detachScroll = null; }
                activeHitIndex = -1;
                document.getElementById("search-input").setAttribute("aria-expanded", "true");

                if (hits.length === 0) {
                    currentHits = [];
                    resultsEl.innerHTML = `<div class="search-no-results">${t(global ? "noResults" : "noResultsLoaded")}</div>`;
                    resultsEl.style.display = "block";
                    countEl.style.display = "none";
                    return;
                }

                countEl.textContent = total.toLocaleString(numLocale()) + " " + t(total === 1 ? "result" : "results");
                countEl.style.display = "block";

                // virtual scroll container
                resultsEl.innerHTML = `<div style="position:relative;height:${hits.length * ROW_H}px"><div class="vs-slab" style="position:absolute;width:100%;top:0;will-change:transform"></div></div>`;
                resultsEl.style.display = "block";
                resultsEl.scrollTop = 0;
                const slab = resultsEl.querySelector(".vs-slab");

                function renderRows() {
                    const top = resultsEl.scrollTop;
                    const visH = resultsEl.clientHeight;
                    const first = Math.max(0, Math.floor(top / ROW_H) - 3);
                    const last = Math.min(hits.length, Math.ceil((top + visH) / ROW_H) + 3);
                    slab.style.top = `${first * ROW_H}px`;

                    // recycle existing nodes when count matches to avoid full DOM churn
                    const needed = last - first;
                    while (slab.children.length > needed) slab.lastChild.remove();
                    while (slab.children.length < needed) slab.appendChild(document.createElement("div"));

                    for (let vi = 0; vi < needed; vi++) {
                        const hi = first + vi;
                        const hit = hits[hi];
                        const el = slab.children[vi];
                        el.className = "search-result-item" + (hi === activeHitIndex ? " keyboard-active" : "");
                        el.setAttribute("role", "option");
                        el.setAttribute("aria-selected", hi === activeHitIndex ? "true" : "false");

                        // only rebuild the row if it now shows a different hit
                        if (el.dataset.hi !== String(hi)) {
                            el.dataset.hi = hi;
                            const dot = Object.assign(document.createElement("div"), { className: "legend-color" });
                            dot.style.background = _labelToHex.get(hit.label) ?? "#888";
                            const badge = Object.assign(document.createElement("span"), { className: "canton-badge", textContent: hit.cantonId });
                            const nameEl = Object.assign(document.createElement("span"), { className: "search-result-name", textContent: hit.name });
                            const formEl = Object.assign(document.createElement("span"), { className: "search-result-form", textContent: labelText(hit.label) });
                            el.replaceChildren(dot, badge, nameEl, formEl);
                            el.onclick = () => selectHit(hit);
                        }
                    }
                }

                resultsEl.addEventListener("scroll", renderRows, { passive: true });
                _detachScroll = () => resultsEl.removeEventListener("scroll", renderRows);
                currentHits = hits; currentRenderFn = renderRows; currentResultsEl = resultsEl;
                renderRows();
            }

            // fly to a hit, loading its canton first if needed, and ring every location
            function selectHit(hit) {
                const { name, cantonId } = hit;
                const approx = hit.lat !== undefined ? [hit.lng, hit.lat] : hit.point.position;

                function resolvePts() {
                    if (hit.point) return [hit.point];
                    return pointByName[cantonId]?.get(name) ?? [];
                }

                function placeMarkers() {
                    searchMarkers.forEach(m => m.remove());
                    searchMarkers = [];
                    clearTimeout(searchMarkersTimer);
                    const pts = resolvePts();
                    if (pts.length === 0) { flyTo({ center: approx, zoom: 14 }); return; }
                    for (const p of pts) {
                        const el = Object.assign(document.createElement("div"), { className: "search-marker" });
                        searchMarkers.push(new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat(p.position).addTo(map));
                    }
                    if (pts.length === 1) {
                        flyTo({ center: pts[0].position, zoom: 14 });
                    } else {
                        const lngs = pts.map(p => p.position[0]), lats = pts.map(p => p.position[1]);
                        fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], { padding: 80 });
                    }
                    searchMarkersTimer = setTimeout(() => { searchMarkers.forEach(m => m.remove()); searchMarkers = []; }, 3000);
                    onHitShown(pts, name);
                }

                if (!activeCantons.has(cantonId) || !cantonData[cantonId]) {
                    flyTo({ center: approx, zoom: 14 });
                    setCantonActive(cantonId, true);
                    loadCantonData(_cantonById.get(cantonId)).then(() => { refreshLayer(); placeMarkers(); });
                } else {
                    placeMarkers();
                }

                // keep the query so the list can be reopened and refined
                closeResults();
                document.getElementById("search-input").blur();
            }

            const searchInput = document.getElementById("search-input");
            searchInput.addEventListener("input", (e) => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => runSearch(e.target.value), 120);
            });

            searchInput.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (currentHits.length || document.getElementById("search-results").style.display === "block") closeResults();
                    else searchInput.blur();
                    return;
                }
                if (!currentHits.length) return;
                if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                    e.preventDefault();
                    activeHitIndex = e.key === "ArrowDown"
                        ? Math.min(activeHitIndex + 1, currentHits.length - 1)
                        : Math.max(activeHitIndex - 1, 0);
                    const top = activeHitIndex * ROW_H;
                    const bot = top + ROW_H;
                    if (top < currentResultsEl.scrollTop) currentResultsEl.scrollTop = top;
                    else if (bot > currentResultsEl.scrollTop + currentResultsEl.clientHeight) currentResultsEl.scrollTop = bot - currentResultsEl.clientHeight;
                    currentRenderFn?.();
                } else if (e.key === "Enter") {
                    selectHit(currentHits[Math.max(activeHitIndex, 0)]);
                }
            });

            searchInput.addEventListener("focus", () => {
                startSearchIndex();
                if (searchInput.value.trim()) runSearch(searchInput.value);
            });

            // "/" jumps to the search box from anywhere that isn't a text field
            document.addEventListener("keydown", (e) => {
                if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
                if (e.target.closest?.("input, textarea, [contenteditable]")) return;
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            });

            document.getElementById("search-clear").addEventListener("click", () => {
                searchInput.value = "";
                document.getElementById("search-clear").style.display = "none";
                closeResults();
                searchInput.focus();
            });

            document.addEventListener("click", (e) => {
                if (!document.getElementById("search-bar").contains(e.target)) closeResults();
            });

            boot();

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            }
        </script>
    </body>
</html>
